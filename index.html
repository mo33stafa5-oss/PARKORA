<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PARKORA Workflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a clear engineering handbook for a student team — precise, calm, no fluff.
   IDEA: the wiring sheet taped next to the breadboard: real board pinout, real wire colours, power rails.
   PICTURE: a live node graph (React) — ESP32 board in the middle, every part wired to its exact pin.
   COLOUR and TYPE: concrete-paper ground, slate board, parking-line yellow for focus; Archivo + IBM Plex.
   LAYOUT: tabs on top, canvas left, explanation panel right; panel drops under the canvas on phones. */
:root{color-scheme:light dark;--bg:light-dark(#f3f2ec,#0e1317);--panel:light-dark(#ffffff,#151c21);--ink:light-dark(#141e26,#e6ebee);--mute:light-dark(#5b6770,#95a2ab);--line:light-dark(#d8d6cc,#29333a);--grid:light-dark(#d9d7cb,#1d262c);--board:#1c2a33;--acc:#f5b800;--gnd:light-dark(#2b3237,#b4bec4);--dec:light-dark(#fffaf0,#1d1b12);--alarm:light-dark(#fff0f0,#2a1517);--hh:118px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
header{padding:14px max(2vw,14px) 0;border-bottom:1px solid var(--line);background:var(--panel)}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
h1{font:800 32px/1.05 Archivo,sans-serif;margin:0;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:15px}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px}
.tab{flex:none;min-height:44px;padding:0 14px;border:0;background:none;border-bottom:3px solid transparent;font-weight:600;color:var(--mute);cursor:pointer}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--acc)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 390px;height:calc(100vh - var(--hh));min-height:560px}
.stage{position:relative;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(var(--grid) 1.2px,transparent 1.4px);background-size:22px 22px;touch-action:none;cursor:grab}
.stage.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
svg.edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.elabel{font:600 12px "IBM Plex Sans",sans-serif;fill:var(--mute);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.elabel.on{fill:var(--ink)}
.flow-on{stroke-dasharray:7 6;animation:dash .9s linear infinite}
@keyframes dash{to{stroke-dashoffset:-26}}
@media(prefers-reduced-motion:reduce){.flow-on{animation:none}}
.node{position:absolute;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;box-shadow:0 1px 0 var(--line),0 10px 22px -16px rgba(0,0,0,.45);cursor:pointer;user-select:none;-webkit-user-select:none;transition:opacity .2s}
.node.sel{outline:3px solid var(--acc);outline-offset:3px}
.node.hl{border-color:var(--acc);box-shadow:0 0 0 5px color-mix(in srgb,var(--acc) 38%,transparent)}
.node.dim{opacity:.32}
.nh{height:50px;padding:7px 12px 0;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:flex-start}
.sw{flex:none;width:10px;height:10px;border-radius:3px;margin-top:5px}
.nt{font:600 14px/1.2 Archivo,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ns{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.port{height:24px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;font:12px "IBM Plex Mono",monospace}
.port b{font-weight:600}
.esp{background:var(--board);color:#e9eef1;border-color:#0b1216}
.esp .eh{height:52px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #31424d}
.esp .eh .nt{color:#fff}.esp .eh .ns{color:#9fb1bd}
.shield{width:58px;height:34px;border-radius:4px;background:linear-gradient(160deg,#cfd6db,#8d989f);box-shadow:inset 0 0 0 2px #e9eef1}
.prow{height:22px;display:grid;grid-template-columns:1fr 1fr;font:11px/22px "IBM Plex Mono",monospace;padding:0 6px}
.pin{display:flex;align-items:center;gap:6px;white-space:nowrap}
.pin.r{justify-content:flex-end}
.pad{width:9px;height:9px;border-radius:50%;background:#c9a24a;flex:none}
.pin.avoid{color:#6f818c;text-decoration:line-through}.pin.avoid .pad{background:#4a5962}
.pin.spare{color:#9fb1bd}.pin.spare .pad{background:transparent;border:1.5px solid #c9a24a}
.pin.pwr .pad{background:#e34b4b}.pin.gnd .pad{background:#9aa6ad}
.pin.used{color:#fff}
.psu{background:light-dark(#2b2f33,#20262b);color:#f1f1f1;border-color:#111}
.psu .ns{color:#b8c0c6}
.fn{display:flex;flex-direction:column;justify-content:center;padding:8px 12px;gap:2px}
.fn .nt{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.fn .ns{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.3}
.fn.dec{background:var(--dec);border-style:dashed;border-color:light-dark(#c9a227,#8a7420)}
.fn.alarm{background:var(--alarm);border-color:#d7263d}
.fn.start{background:var(--board);color:#fff;border-color:#0b1216}.fn.start .ns{color:#a9bac5}
.fn.ext{border-radius:22px}
.kind{font-size:11px;color:var(--mute);font-weight:600}
.fn.start .kind{color:#a9bac5}
.lane{position:absolute;font:800 18px/1 Archivo,sans-serif;color:var(--mute);white-space:nowrap;pointer-events:none}
.lane small{display:block;font:500 12px "IBM Plex Sans",sans-serif;margin-top:4px}
.tools{position:absolute;left:10px;top:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:2;pointer-events:none}
.tools>*{pointer-events:auto}
.tb{min-height:40px;padding:0 12px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-size:13px;font-weight:500;cursor:pointer}
.tb[aria-pressed=true]{background:var(--acc);color:#17140a;border-color:var(--acc)}
select.tb{padding-right:28px}
.legend{position:absolute;left:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:6px 14px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12px;z-index:2;max-width:calc(100% - 20px)}
.legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px}
.hint{position:absolute;right:12px;bottom:12px;font-size:12px;color:var(--mute);z-index:2}
aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:22px 22px 40px}
h2{font:800 24px/1.1 Archivo,sans-serif;margin:0 0 6px}
h3{font:600 15px/1.3 Archivo,sans-serif;margin:22px 0 8px}
.lead{margin:6px 0 0}
.muted{color:var(--mute)}
.kv{width:100%;border-collapse:collapse;font-size:14px}
.kv td{border-top:1px solid var(--line);padding:7px 0;vertical-align:top}
.kv td:first-child{color:var(--mute);width:40%;padding-right:10px}
.kv code,.mono{font-family:"IBM Plex Mono",monospace;font-size:13px}
ul.watch{margin:0;padding-left:18px}ul.watch li{margin:0 0 8px}
.codebox{position:relative;margin-top:6px}
pre{margin:0;background:light-dark(#f4f4f1,#0d1215);border:1px solid var(--line);border-radius:8px;padding:12px;font:12.5px/1.5 "IBM Plex Mono",monospace;overflow-x:auto}
.copy{position:absolute;right:6px;top:6px;min-height:32px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:12px;cursor:pointer}
.lcd{display:inline-block;background:#2257c8;border-radius:6px;padding:8px 10px;box-shadow:inset 0 0 0 3px #173f96}
.lcd div{font:600 15px/1.25 "IBM Plex Mono",monospace;color:#eaf1ff;white-space:pre}
.steps{list-style:none;margin:10px 0 0;padding:0;counter-reset:s}
.steps li{counter-increment:s;padding:8px 10px 8px 38px;position:relative;border-radius:8px;cursor:pointer;font-size:14px}
.steps li::before{content:counter(s);position:absolute;left:8px;top:8px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);font:600 12px/19px "IBM Plex Sans";text-align:center}
.steps li.cur{background:color-mix(in srgb,var(--acc) 22%,transparent)}
.steps li.cur::before{background:var(--acc);border-color:var(--acc);color:#17140a}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-weight:600;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#17140a}
.doc{padding:26px max(4vw,16px) 60px;max-width:1240px;margin:0 auto}
.doc h2{font-size:30px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:18px}
table.t{width:100%;border-collapse:collapse;font-size:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.t th{text-align:left;font:600 13px "IBM Plex Sans";color:var(--mute);padding:10px 12px;border-bottom:1px solid var(--line)}
.t td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:top}
.t td.g{font-family:"IBM Plex Mono",monospace;white-space:nowrap}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:20px;white-space:nowrap}
.tag.used{background:color-mix(in srgb,var(--acc) 30%,transparent)}
.tag.spare{border:1px solid var(--line)}
.tag.avoid{background:color-mix(in srgb,#d7263d 18%,transparent);color:light-dark(#9b1426,#ff8a95)}
.tag.power{background:color-mix(in srgb,#888 18%,transparent)}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.stat b{display:block;font:800 clamp(26px,4vw,36px)/1 Archivo,sans-serif}
.stat span{font-size:13px;color:var(--mute)}
.scroll{overflow-x:auto}
@media(max-width:900px){:root{--hh:0px}.main{grid-template-columns:minmax(0,1fr);height:auto}.stage{height:72vh;min-height:460px}aside{border-left:0;border-top:1px solid var(--line)}.cols{grid-template-columns:minmax(0,1fr)}.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){h1{font-size:28px}.hint{display:none}table.t{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 12px;padding-inline-start:8.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mute);font-family:"IBM Plex Sans"}.stack td:empty{display:none}.stack tr+tr{border-top:1px solid var(--line)}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<div id="root"><p style="padding:24px">Loading the PARKORA workflow…</p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="garage3d.js"></script>
<script src="app.js"></script>
</body>
</html>
